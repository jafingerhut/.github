# Reusable workflow for publish a release. Usually triggered by changes to the
# VERSION file.
name: Publish Release

on:
  workflow_call:
    inputs:
      version_file:
        description: "Path to the version file (e.g. VERSION or Version.txt)"
        required: false
        default: "VERSION"
        type: string
      tag_prefix:
        description: "Prefix for the git tag (e.g. 'v' for v1.2.3, or '' for 1.2.3)"
        required: false
        default: "v"
        type: string
      dispatch_package:
        description: "p4lang/packages package to announce the release to (e.g. 'pi'), or '' for none"
        required: false
        default: ""
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key of the GitHub App that dispatches to p4lang/packages"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.check_tag.outputs.tag_exists == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="$(cat '${{ inputs.version_file }}')"
          TAG="${{ inputs.tag_prefix }}${VERSION}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="${{ env.TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release creation."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist."
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-packages:
    needs: publish
    if: inputs.dispatch_package != '' && needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for p4lang/packages
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: p4lang
          repositories: packages

      - name: Dispatch to p4lang/packages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ inputs.dispatch_package }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh api repos/p4lang/packages/dispatches \
            -f event_type=upstream-tag \
            -f "client_payload[package]=$PACKAGE" \
            -f "client_payload[tag]=$TAG"
